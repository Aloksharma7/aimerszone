name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "nepal-lms-api/**"
      - "deploy/deploy-api.sh"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and run deploy-api.sh on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /var/www/myapp/repo/deploy/deploy-api.sh
