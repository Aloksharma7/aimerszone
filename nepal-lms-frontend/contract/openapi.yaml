openapi: 3.1.0
info:
  title: Institution LMS API
  version: 1.2.0
  summary: Production frontend contract for the Laravel API and Next.js LMS.
  description: 'Production V1 API for one Nepal-based educational institution. Browser

    authentication uses Laravel Sanctum stateful cookies and CSRF protection.

    This baseline contract must be expanded in the same commit as each feature.


    This revision enumerates every endpoint currently consumed by the production-ready frontend. Feature-specific
    DTOs remain documented in the frontend data adapters and API integration guide; Laravel must preserve the common
    response envelope and authorization rules.

    '
servers:
- url: /
  description: Same-origin browser gateway
- url: http://127.0.0.1:8000
  description: Local Laravel origin for server-side development only
tags:
- name: Health
- name: Authentication
- name: Public
- name: Student
- name: Teacher
- name: Enrollment Officer
- name: Accounting
- name: Administration
- name: Integrations
security: []
paths:
  /up:
    get:
      tags:
      - Health
      operationId: getApiHealth
      summary: Check Laravel API health
      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /sanctum/csrf-cookie:
    get:
      tags:
      - Authentication
      operationId: initializeCsrfCookie
      summary: Initialize Sanctum CSRF and session cookies
      responses:
        '204':
          description: CSRF cookie initialized
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      operationId: registerStudent
      summary: Register a student account
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Authenticate with email or mobile and password
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated or next authentication action returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Invalidate the current session
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      operationId: getCurrentUser
      summary: Return safe current-user identity and capabilities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Authentication
      operationId: requestPasswordReset
      summary: Request a password reset without account enumeration
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Neutral completion response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/auth/reset-password:
    post:
      tags:
      - Authentication
      operationId: resetPassword
      summary: Reset password using a valid reset token
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/public/settings:
    get:
      tags:
      - Public
      operationId: getPublicSettings
      summary: Return published institution identity/contact settings
      responses:
        '200':
          description: Public settings
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PublicSettings'
  /api/v1/public/payment-methods:
    get:
      tags:
      - Public
      operationId: listPublicPaymentMethods
      summary: List institution-approved public payment methods
      responses:
        '200':
          description: Published payment methods
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicPaymentMethod'
  /api/v1/public/categories:
    get:
      tags:
      - Public
      operationId: listPublicCategories
      summary: List published course categories
      responses:
        '200':
          description: Category collection
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
  /api/v1/public/courses:
    get:
      tags:
      - Public
      operationId: listPublicCourses
      summary: List published courses and available batches
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: search
        in: query
        schema:
          type: string
          maxLength: 100
      - name: filter[category]
        in: query
        schema:
          type: string
      - name: filter[access]
        in: query
        schema:
          type: string
          enum:
          - free
          - paid
      responses:
        '200':
          description: Published courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCoursesResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/public/courses/{slug}:
    get:
      tags:
      - Public
      operationId: getPublicCourse
      summary: Get a published course with public batches
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Published course detail
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CourseDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/student/dashboard:
    get:
      tags:
      - Student
      operationId: getStudentDashboard
      summary: Return the authenticated student's dashboard
      security:
      - cookieAuth: []
      x-permission: student.portal.access
      responses:
        '200':
          description: Student dashboard
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StudentDashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/student/courses:
    get:
      tags:
      - Student
      operationId: listStudentCourses
      summary: List authenticated student's enrollments
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Student enrollments
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnrollmentSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/student/classes/{sessionId}/join:
    post:
      tags:
      - Student
      operationId: joinClassSession
      summary: Authorize and create an immediate class join redirect
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Authorized redirect data
          headers:
            Cache-Control:
              schema:
                type: string
              description: Must prevent caching
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/RedirectAction'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/student/payments:
    get:
      tags:
      - Student
      operationId: listStudentPayments
      summary: List authenticated student's payments
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - Student
      operationId: submitStudentPayment
      summary: Submit a manual payment and proof
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentSubmissionRequest'
      responses:
        '201':
          description: Payment submitted for review
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Payment'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/teacher/dashboard:
    get:
      tags:
      - Teacher
      operationId: getTeacherDashboard
      summary: Return assigned classes and pending teaching actions
      security:
      - cookieAuth: []
      x-permission: teacher.portal.access
      responses:
        '200':
          description: Teacher dashboard
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TeacherDashboard'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/teacher/classes/{sessionId}/start:
    post:
      tags:
      - Teacher
      operationId: startClassSession
      summary: Authorize assigned teacher and return host start redirect
      security:
      - cookieAuth: []
      x-permission: classes.start
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Authorized teacher-only redirect data
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/RedirectAction'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StateConflict'
  /api/v1/teacher/classes/{sessionId}/attendance/finalize:
    post:
      tags:
      - Teacher
      operationId: finalizeAttendance
      summary: Finalize attendance for an assigned class session
      security:
      - cookieAuth: []
      x-permission: attendance.finalize
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeAttendanceRequest'
      responses:
        '200':
          description: Attendance finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/staff/students:
    get:
      tags:
      - Enrollment Officer
      operationId: listStudentsForStaff
      summary: Search and paginate students for enrollment support
      security:
      - cookieAuth: []
      x-permission: students.view
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: search
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Student collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentsResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Enrollment Officer
      operationId: createStudentByStaff
      summary: Create a student from WhatsApp or physical enrollment
      security:
      - cookieAuth: []
      x-permission: students.create
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreateStudentRequest'
      responses:
        '201':
          description: Student created with forced password change
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StudentSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/accounting/payments:
    get:
      tags:
      - Accounting
      operationId: listAccountingPayments
      summary: Paginate payment review queue
      security:
      - cookieAuth: []
      x-permission: payments.view
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - name: filter[status]
        in: query
        schema:
          $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: Payment queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaymentsResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/accounting/payments/{paymentId}/approve:
    post:
      tags:
      - Accounting
      operationId: approvePayment
      summary: Approve payment, issue receipt, and activate enrollment atomically
      security:
      - cookieAuth: []
      x-permission: payments.approve
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovePaymentRequest'
      responses:
        '200':
          description: Approved payment and enrollment result
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentApprovalResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/accounting/payments/{paymentId}/reject:
    post:
      tags:
      - Accounting
      operationId: rejectPayment
      summary: Reject a submitted payment with a documented reason
      security:
      - cookieAuth: []
      x-permission: payments.reject
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Payment rejected
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Payment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StateConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/courses:
    get:
      tags:
      - Administration
      operationId: listAdminCourses
      summary: Paginate courses for administration
      security:
      - cookieAuth: []
      x-permission: courses.manage
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Administrative course list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCoursesResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Administration
      operationId: createCourse
      summary: Create a course draft
      security:
      - cookieAuth: []
      x-permission: courses.manage
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpsertRequest'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CourseDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/audit-logs:
    get:
      tags:
      - Administration
      operationId: listAuditLogs
      summary: Paginate append-only audit evidence
      security:
      - cookieAuth: []
      x-permission: audit.view
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/account/profile:
    get:
      tags:
      - Authentication
      operationId: getAccountProfile
      summary: Read or update the current account profile
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/GenericApiResponse'
                - $ref: '#/components/schemas/GenericCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      security:
      - cookieAuth: []
    patch:
      tags:
      - Authentication
      operationId: patchAccountProfile
      summary: Read or update the current account profile
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiResponse'
        '409':
          $ref: '#/components/responses/StateConflict'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericMutationRequest'
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - cookieAuth: []
  /api/v1/account/password:
    put:
      tags:
      - Authentication
      operationId: putAccountPassword
      summary: Change the current account password
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiResponse'
        '409':
          $ref: '#/components/responses/StateConflict'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericMutationRequest'
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - cookieAuth: []
  /api/v1/account/sessions/revoke-others:
    post:
      tags:
      - Authentication
      operationId: postAccountSessionsRevokeOthers
      summary: Revoke every session except the current one
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiResponse'
        '409':
          $ref: '#/components/responses/StateConflict'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericMutationRequest'
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - cookieAuth: []
  /api/v1/account/two-factor/setup:
    post:
      tags:
      - Authentication
      operationId: postAccountTwoFactorSetup
      summary: Begin two-factor authentication setup
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiResponse'
        '409':
          $ref: '#/components/responses/StateConflict'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericMutationRequest'
      parameters:
      - $ref: '#/components/parameters/XsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - cookieAuth: []
  /api/v1/auth/change-password:
    post:
      tags:
      - Authentication
      operationId: postAuthChangePassword
      summary: Complete a required password change
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericApiResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '201':
          description: Resource created
