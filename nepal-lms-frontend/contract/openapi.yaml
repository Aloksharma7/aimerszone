components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel Sanctum stateful session cookie. Actual cookie name is environment-configured.
  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Value derived by the browser client from the XSRF-TOKEN cookie.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated unique key for a critical mutation.
      schema:
        type: string
        minLength: 16
        maxLength: 100
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthenticated:
      description: Session is absent or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Authentication is required.
            code: unauthenticated
    Forbidden:
      description: Authenticated actor is not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: You are not allowed to perform this action.
            code: forbidden
    NotFound:
      description: Resource not found or deliberately concealed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: The requested resource was not found.
            code: not_found
    StateConflict:
      description: Current state does not allow the operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: This action cannot be completed in the current state.
            code: state_conflict
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: Too many requests. Please try again later.
            code: rate_limited
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: ok
    MessageResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    ApiError:
      type: object
      required:
      - message
      - code
      properties:
        message:
          type: string
        code:
          type: string
        request_id:
          type:
          - string
          - 'null'
    ValidationError:
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - type: object
        required:
        - errors
        properties:
          errors:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    PaginationMeta:
      type: object
      required:
      - current_page
      - last_page
      - per_page
      - total
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
    PaginationLinks:
      type: object
      required:
      - next
      - previous
      properties:
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
    RegisterRequest:
      type: object
      required:
      - name
      - mobile
      - password
      - password_confirmation
      - terms_accepted
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        mobile:
          type: string
          minLength: 7
          maxLength: 20
        email:
          type:
          - string
          - 'null'
          format: email
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string
        preferred_language:
          type: string
          enum:
          - en
          - ne
          default: en
        terms_accepted:
          type: boolean
          const: true
        recording_policy_acknowledged:
          type: boolean
          default: false
    LoginRequest:
      type: object
      required:
      - identifier
      - password
      properties:
        identifier:
          type: string
          maxLength: 190
        password:
          type: string
        remember:
          type: boolean
          default: false
    ResetPasswordRequest:
      type: object
      required:
      - token
      - email
